<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  :root {
    --bg-start: #0f0c29;
    --bg-mid: #302b63;
    --bg-end: #24243e;
    --text: #f5f5f7;
    --accent: #7f5af0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }

  .container {
    max-width: 600px;
  }

  h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }

  p {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: rgba(245, 245, 247, 0.75);
    margin-bottom: 2.5rem;
  }

  .accent {
    color: var(--accent);
  }

  form {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  input[type="email"] {
    flex: 1;
    min-width: 220px;
    max-width: 320px;
    padding: 0.85rem 1.1rem;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="email"]::placeholder {
    color: rgba(245, 245, 247, 0.5);
  }

  input[type="email"]:focus {
    border-color: var(--accent);
  }

  button {
    padding: 0.85rem 1.5rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  button:hover {
    opacity: 0.85;
  }

  .message {
    margin-top: 1rem;
    font-size: 0.95rem;
    color: rgba(245, 245, 247, 0.8);
    min-height: 1.2em;
  }

  footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: rgba(245, 245, 247, 0.4);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>We're <span class="accent">coming soon</span></h1>
    <p>Something new is on the way. Leave your email and we'll let you know the moment we launch.</p>

    <form id="notify-form">
      <input type="email" id="email" placeholder="you@example.com" required>
      <button type="submit">Notify me</button>
    </form>
    <div class="message" id="message"></div>

    <footer>&copy; <span id="year"></span> All rights reserved.</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('notify-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('message').textContent = "Thanks! We'll be in touch.";
      this.reset();
    });
  </script>
</body>
</html>
