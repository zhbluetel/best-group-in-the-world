<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plushie Pals — Coming Soon</title>
<style>
  :root {
    --bg-start: #ffe1ef;
    --bg-mid: #ffd6e8;
    --bg-end: #fff3e6;
    --card-bg: #ffffff;
    --text: #3a2e39;
    --muted: #7a6b76;
    --accent: #ff6f91;
    --accent-dark: #e2547a;
    --border: #f0e1e8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem 1rem;
  }

  .container {
    width: 100%;
    max-width: 640px;
  }

  .hero {
    text-align: center;
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.75rem;
  }

  .accent {
    color: var(--accent-dark);
  }

  .hero p {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--muted);
    max-width: 480px;
    margin: 0 auto;
  }

  form {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 20px 40px rgba(226, 84, 122, 0.12);
  }

  .field {
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
  }

  .hint {
    display: block;
    font-weight: 400;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fffafc;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input[type="text"]:focus,
  input[type="email"]:focus {
    border-color: var(--accent);
  }

  .plushie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.6rem;
  }

  .plushie-option {
    position: relative;
  }

  .plushie-option input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }

  .plushie-option .card {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fffafc;
    font-size: 0.9rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .plushie-option .card .emoji {
    font-size: 1.3rem;
  }

  .plushie-option input[type="checkbox"]:checked ~ .card {
    border-color: var(--accent);
    background: #fff0f5;
  }

  .plushie-option input[type="checkbox"]:focus-visible ~ .card {
    outline: 2px solid var(--accent);
  }

  textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fffafc;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    transition: border-color 0.2s ease;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 0.9rem 1.5rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  button:hover {
    opacity: 0.88;
  }

  .message {
    margin-top: 1rem;
    font-size: 0.95rem;
    color: var(--accent-dark);
    text-align: center;
    min-height: 1.2em;
    font-weight: 600;
  }

  footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>Plushie Pals are <span class="accent">coming soon</span></h1>
      <p>Our huggable new range is almost here. Register your interest below and be first to know when we launch.</p>
    </div>

    <form id="interest-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="company">Company <span class="hint" style="display:inline">(optional)</span></label>
        <input type="text" id="company" name="company">
      </div>

      <div class="field">
        <label>
          Which plushie(s) catch your eye?
          <span class="hint">Select all that appeal to you</span>
        </label>
        <div class="plushie-grid">
          <label class="plushie-option">
            <input type="checkbox" name="plushies" value="Ferris">
            <span class="card"><span class="emoji">🦀</span> Ferris</span>
          </label>
          <label class="plushie-option">
            <input type="checkbox" name="plushies" value="Gordo">
            <span class="card"><span class="emoji">🐹</span> Gordo</span>
          </label>
          <label class="plushie-option">
            <input type="checkbox" name="plushies" value="Duke">
            <span class="card"><span class="emoji">☕</span> Duke</span>
          </label>
          <label class="plushie-option">
            <input type="checkbox" name="plushies" value="Slippy">
            <span class="card"><span class="emoji">🐍</span> Slippy</span>
          </label>
          <label class="plushie-option">
            <input type="checkbox" name="plushies" value="Cammy">
            <span class="card"><span class="emoji">🐫</span> Cammy</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="dream-plushie">
          Dreaming of a plushie we haven't made yet?
          <span class="hint">Optional — tell us what you'd love to see</span>
        </label>
        <textarea id="dream-plushie" name="dreamPlushie" placeholder="e.g. a grumpy hedgehog wearing tiny glasses"></textarea>
      </div>

      <button type="submit">Register interest</button>
      <div class="message" id="message"></div>
    </form>

    <footer>&copy; <span id="year"></span> Plushie Pals. All rights reserved.</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('interest-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('message').textContent = "Thanks for registering! We'll be in touch before launch.";
      this.reset();
    });
  </script>
</body>
</html>
